---
# 固定 RPM 版本，避免课堂重复交付时安装到不同版本。
containerd_package_version: "2.3.6-1.el9"
# 阿里云 ECS 使用国内镜像站，减少访问 Docker 官方站点时的网络失败。
containerd_repo_baseurl: "https://mirrors.aliyun.com/docker-ce/linux/centos/9/$basearch/stable"
containerd_repo_gpgkey: "https://mirrors.aliyun.com/docker-ce/linux/centos/gpg"

# 使用国内仓库，版本与 Kubernetes v1.36.5 所需的 pause 镜像保持一致。
containerd_sandbox_image: "registry.cn-hangzhou.aliyuncs.com/google_containers/pause:3.10.2"
