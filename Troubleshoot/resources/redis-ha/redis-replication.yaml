                --masterauth "$REDIS_PASSWORD" \
                --replicaof "$REDIS_PRIMARY_HOST" 6379 \
                --replica-read-only yes \
                --appendonly yes \
                --appendfsync everysec \
                --save 3600 1 \
                --dir /data \
                --dbfilename dump.rdb
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
