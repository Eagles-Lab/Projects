# Local PV ：Primary 和 Secondary 1 保存在 node01，Secondary 0 保存在 node02。
# 应用本文件前，必须先在对应节点创建 path 中的目录，并设置为 1001:1001。
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: mysql-local-storage
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mysql-local-primary-0
spec:
  capacity:
    storage: 8Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: mysql-local-storage
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    namespace: default
    name: data-my-mysql-primary-0
  local:
    path: /data/mysql-ha/primary-0
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - node01
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mysql-local-secondary-0
spec:
  capacity:
    storage: 8Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: mysql-local-storage
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    namespace: default
    name: data-my-mysql-secondary-0
  local:
    path: /data/mysql-ha/secondary-0
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - node02
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mysql-local-secondary-1
spec:
  capacity:
    storage: 8Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: mysql-local-storage
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    namespace: default
    name: data-my-mysql-secondary-1
  local:
    path: /data/mysql-ha/secondary-1
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - node01
